[project]
name = "uniagent"
version = "0.1.0"
description = "UniAgent CIKM26"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "json-repair>=0.63.4",
    "openai>=3.15.0",
    "pydantic>=2.13.5",
    "pysbd>=0.3.4",
    "pyterrier[all]>=1.1.2",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.1.0",
    "tira>=0.0.205",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]

[tool.ruff]
src = ["uniagent"]

[tool.pytest.ini_options]
testpaths = ["uniagent/tests"]
pythonpath = ["uniagent"]
